name: Shorts diarios

on:
  schedule:
    # 07:15 UTC = 09:15 en Espana (horario de verano). Ajusta a tu gusto.
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Numero de noticias a procesar"
        required: false
        default: "2"
      dry_run:
        description: "Generar sin publicar (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: shorts-diarios
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          # Voz y ritmo: se cambian desde las Variables del repositorio, sin
          # tocar codigo. Voces graves a probar: Charon, Orus, Algenib, Gacrux.
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
          TTS_SPEED: ${{ vars.TTS_SPEED }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PUBLISH_YOUTUBE: ${{ vars.PUBLISH_YOUTUBE }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          PUBLISH_INSTAGRAM: ${{ vars.PUBLISH_INSTAGRAM }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--run --limit ${{ github.event.inputs.limit || 2 }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS

      - name: Guardar guiones y videos como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: data/output/
          retention-days: 14

      - name: Persistir la cache de noticias
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news_cache.json data/output/queue.csv || true
          git diff --staged --quiet || git commit -m "chore: actualizar cache de noticias [skip ci]"
          git push || echo "Nada que subir"
